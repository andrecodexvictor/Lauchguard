name: LaunchGuard checks
on:
  push:
  pull_request:
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app launchguard scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app.main import app; assert app.title == 'LaunchGuard'"
